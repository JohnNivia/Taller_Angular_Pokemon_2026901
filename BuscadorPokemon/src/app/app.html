<main class="page">
  <section class="card">
    <header class="card__header">
      <h1 class="card__title">Buscador de Pokémon</h1>
      <p class="card__subtitle">
        Escribe un nombre (por ejemplo: <strong>ditto</strong> o <strong>pikachu</strong>) y presiona Buscar.
      </p>
    </header>

    <form class="search" (ngSubmit)="buscar()">
      <input
        class="search__input"
        type="text"
        name="query"
        placeholder="Nombre del Pokémon"
        autocomplete="off"
        [(ngModel)]="query"
        aria-label="Nombre del Pokémon"
      />
      <button class="search__button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Buscando...' : 'Buscar' }}
      </button>
    </form>

    @if (error()) {
      <p class="message message--error" role="alert">{{ error() }}</p>
    }

    @if (pokemon(); as p) {
      <article class="result">
        <div class="result__imageWrap">
          @if (p.image) {
            <img class="result__image" [src]="p.image" [alt]="'Imagen de ' + p.name" />
          }
        </div>
        <h2 class="result__name">{{ p.name }}</h2>
      </article>
    }
  </section>
</main>
